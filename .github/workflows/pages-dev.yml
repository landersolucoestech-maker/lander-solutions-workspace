name: Deploy dev to GitHub Pages

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-dev
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint frontend
        run: bun run lint

      - name: Typecheck frontend
        run: bun run typecheck

      - name: Audit frontend navigation
        run: bun run test:navigation

      - name: Inventory interactive controls
        run: bun scripts/audit-frontend-actions.ts

      - name: Build fully prerendered frontend-only preview
        env:
          GITHUB_PAGES: "true"
          VITE_FRONTEND_PREVIEW: "true"
          VITE_APP_ENV: development
          VITE_SUPABASE_URL: https://jodzhcktrlwinywqgbab.supabase.co
          VITE_EXPECTED_SUPABASE_REF: jodzhcktrlwinywqgbab
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_MmZ_-3awL9UXaFWBRAq18g_Phayw5Yj
        run: bun run build:development

      - name: Prepare Pages artifact with rendered business content
        id: pages
        shell: bash
        run: |
          set -euo pipefail
          shell_path="$(find apps/web/dist apps/web/.output -type f -name '_shell.html' -print -quit 2>/dev/null || true)"
          if [ -z "$shell_path" ]; then
            echo "TanStack Start SPA shell (_shell.html) was not generated." >&2
            exit 1
          fi
          public_dir="$(dirname "$shell_path")"
          if [ ! -f "$public_dir/index.html" ] || [ ! -f "$public_dir/crm/index.html" ]; then
            echo "Required prerendered pages were not generated." >&2
            find "$public_dir" -maxdepth 4 -type f -print | sort >&2
            exit 1
          fi
          route_count="$(find "$public_dir" -type f -name 'index.html' | wc -l | tr -d ' ')"
          if [ "$route_count" -lt 20 ]; then
            echo "Expected complete prerendered route set; found only $route_count index.html files." >&2
            exit 1
          fi
          if grep -a -q "Carregando CRM" "$public_dir/crm/index.html"; then
            echo "CRM was prerendered as a loading state instead of frontend content." >&2
            exit 1
          fi
          if ! grep -a -q "Contatos / Clientes" "$public_dir/crm/index.html"; then
            echo "CRM frontend content is missing from prerendered HTML." >&2
            exit 1
          fi
          if ! grep -a -q "Faturamento bruto" "$public_dir/index.html"; then
            echo "Dashboard frontend content is missing from prerendered HTML." >&2
            exit 1
          fi
          cp "$shell_path" "$public_dir/404.html"
          touch "$public_dir/.nojekyll"
          echo "Published $route_count prerendered frontend pages with visible business content."
          echo "path=$public_dir" >> "$GITHUB_OUTPUT"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.pages.outputs.path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
