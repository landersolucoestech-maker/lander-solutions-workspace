name: One-time frontend formatting repair

on:
  push:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: frontend-format-autofix
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format affected frontend files
        run: >-
          bunx prettier --write
          apps/web/src/app/navigation/app-sidebar.tsx
          apps/web/src/app/navigation/topbar.tsx
          apps/web/src/app/router/root-boundaries.tsx
          apps/web/src/lib/error-page.ts
          apps/web/src/modules/dashboard/pages/financial-dashboard-page.tsx
          apps/web/src/modules/contracts/pages/contract-templates-page.tsx
          apps/web/src/modules/company/organizational-structure/business-units/business-unit-detail-page.tsx
          apps/web/src/modules/finance/reports/unit-economics-queries.ts
          scripts/audit-frontend-navigation.ts
          scripts/audit-frontend-actions.ts
          .github/workflows/pages-dev.yml
          package.json

      - name: Commit formatting repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "landersolucoestech-maker"
          git config user.email "landersolucoestech@gmail.com"
          git add apps/web/src/app/navigation/app-sidebar.tsx \
            apps/web/src/app/navigation/topbar.tsx \
            apps/web/src/app/router/root-boundaries.tsx \
            apps/web/src/lib/error-page.ts \
            apps/web/src/modules/dashboard/pages/financial-dashboard-page.tsx \
            apps/web/src/modules/contracts/pages/contract-templates-page.tsx \
            apps/web/src/modules/company/organizational-structure/business-units/business-unit-detail-page.tsx \
            apps/web/src/modules/finance/reports/unit-economics-queries.ts \
            scripts/audit-frontend-navigation.ts \
            scripts/audit-frontend-actions.ts \
            .github/workflows/pages-dev.yml \
            package.json
          git commit -m "style(frontend): repair formatting for validation"
          git push origin HEAD:dev
