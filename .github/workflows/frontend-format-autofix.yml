name: One-time frontend formatting repair

on:
  push:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: frontend-format-autofix
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format affected files
        run: >-
          bunx prettier --write
          apps/web/src/styles.css
          scripts/audit-frontend-actions.ts
          scripts/audit-frontend-navigation.ts

      - name: Commit formatting repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "landersolucoestech-maker"
          git config user.email "landersolucoestech@gmail.com"
          git add apps/web/src/styles.css scripts/audit-frontend-actions.ts scripts/audit-frontend-navigation.ts
          git commit -m "style(frontend): satisfy canonical formatting"
          git push origin HEAD:dev
