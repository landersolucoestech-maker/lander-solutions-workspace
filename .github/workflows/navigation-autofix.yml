name: One-time frontend navigation autofix

on:
  push:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: frontend-navigation-autofix
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix(frontend): apply navigation autofix') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Patch remaining basepath-unsafe contract link
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/web/src/modules/contracts/pages/contract-templates-page.tsx')
          source = path.read_text()
          old = '<a href="/configuracoes-variaveis-contratos">Configurar variáveis</a>'
          new = '<a href={`${import.meta.env.BASE_URL}configuracoes-variaveis-contratos`}>Configurar variáveis</a>'
          if old in source:
              path.write_text(source.replace(old, new))

      - name: Commit fix when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No navigation autofix required."
            exit 0
          fi
          git config user.name "landersolucoestech-maker"
          git config user.email "landersolucoestech@gmail.com"
          git add apps/web/src/modules/contracts/pages/contract-templates-page.tsx
          git commit -m "fix(frontend): apply navigation autofix"
          git push origin HEAD:dev
